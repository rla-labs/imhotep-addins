# media: audio and video with static ffmpeg and ffprobe 7.0.2 (John Van Sickle's builds, as
# eugeneware/ffmpeg-static b6.1.1 publishes them), checked by the sha256 below.
summary = "Audio and video cut, joined, converted, compressed and inspected with ffmpeg and ffprobe 7.0.2 (static builds, GPL)"
version = "1.0.0"
instructions = """
For audio and video use `ffmpeg` and `ffprobe`, already installed; never install them.
Load the `media` skill first. Every output goes in your folder, never in /tmp."""
bin = ["bin/ffmpeg", "bin/ffprobe"]
# Probing only reads; ffmpeg writes files, so it keeps asking unless the project allows it.
rules = ["ffprobe *"]

[package]
smoke = ["bin/ffmpeg", "-version"]

[[package.file]]
url = "https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/ffmpeg-linux-x64.gz"
sha256 = "bfe8a8fc511530457b528c48d77b5737527b504a3797a9bc4866aeca69c2dffa"
arch = "x86_64"
unpack = "gz"
to = "bin/ffmpeg"

