# diagrams: Mermaid to SVG, PNG or text with Pretty Mermaid (imxv/Pretty-mermaid-skills) at a
# pinned commit, no browser. Every file is fixed here by its sha256: the app, Node 22 (from
# nodejs.org's SHASUMS256.txt), its npm packages (the lockfile's, each checked against the
# lockfile's sha512 when they were pinned; no install script), and the Inter font.
summary = "Mermaid diagrams to SVG, PNG or text with Pretty Mermaid, no browser"
version = "1.0.0"
instructions = """
For diagrams (flowcharts, sequence, state, class, ER, XY charts) write Mermaid in a .mmd
file and render it with `render-mermaid`, already installed; never install a renderer or a
browser. Load the `diagrams` skill first."""
bin = ["bin/render-mermaid", "bin/batch-mermaid", "bin/list-mermaid-themes"]
# Rendering reads a .mmd and writes the image the agent names; listing themes only reads.
rules = ["render-mermaid *", "list-mermaid-themes *"]

[package]
setup = [["/bin/sh", "/project/setup.sh"]]
smoke = ["bin/list-mermaid-themes"]

