# browser: a headless Chromium the agent drives through Playwright MCP's tools. Every file is
# fixed here by its sha256: Node 22 (nodejs.org's SHASUMS256.txt), Playwright MCP 0.0.83 and
# the two Playwright packages it needs (each checked against the lockfile's sha512 when they
# were pinned; no install script), and Chrome Headless Shell 155.0.8059.12, the build
# Playwright 1.64.0-alpha expects, from Playwright's CDN.
summary = "A headless Chromium the agent drives with Playwright MCP, on the public internet only"
version = "1.0.0"
instructions = """
You have a headless browser (its tools are browser__browser_…). Use it for pages a plain
fetch cannot read: ones built by JavaScript, or behind clicks and forms. Load the `browser`
skill first. It reaches the public internet only."""
# Screenshots and PDFs go to the project's folder.
project = "rw"

[server]
command = ["/opt/agent/bin/browser-mcp"]
# Its server alone, never the agent: through Imhotep's proxy, HTTPS and HTTP to public
# addresses only.
network = "public"
timeout_s = 120
access = "ask"
# Reading the page runs unasked; what acts on it asks; code in the page and uploads from the
# project are refused. A project changes any of them with its exceptions.
tools = { browser_snapshot = "allow", browser_take_screenshot = "allow", browser_console_messages = "allow", browser_network_requests = "allow", browser_network_request = "allow", browser_find = "allow", browser_wait_for = "allow", browser_evaluate = "deny", browser_run_code_unsafe = "deny", browser_file_upload = "deny" }

[package]
setup = [["/bin/sh", "/project/setup.sh"]]
smoke = ["/bin/sh", "/opt/addins/browser/test/start.sh"]

