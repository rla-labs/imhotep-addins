# pdf: PDFs read, made from HTML or Markdown, merged, split, rotated, rendered and protected.
# Install: imhotep addin install pdf (or Settings → Extensions). Its programs come from the
# release pdf-bin-2.0.0 of rla-labs/argus-extensions, built there by CI on glibc 2.28,
# checked by the sha256 below.
summary = "PDFs read, made from HTML or Markdown, merged, split, rotated, rendered and protected with pdftool (PDFium, qpdf, ironpress)"
version = "2.0.0"
instructions = """
For PDF files use `pdftool`, already installed (info, text, merge, split, pages, rotate,
to-png, compress, encrypt, decrypt, metadata, and from-html / from-md to make a PDF);
for anything else, `qpdf`. Load the `pdf` skill first."""
bin = ["bin/pdftool", "bin/qpdf"]
# Reading never changes a file; every other command writes a new one and keeps asking.
rules = ["pdftool info *", "pdftool text *"]

[package]
smoke = ["bin/pdftool", "--version"]

[[package.file]]
url = "https://github.com/rla-labs/argus-extensions/releases/download/pdf-bin-2.0.0/pdf-bin-linux-x86_64.tar.gz"
sha256 = "2437d3ed160d6ae9c6f8f338f6ddb12fa409ce7b169d19e464346506d720a89a"
arch = "x86_64"
unpack = "tar"

[[package.file]]
url = "https://github.com/rla-labs/argus-extensions/releases/download/pdf-bin-2.0.0/pdf-bin-linux-aarch64.tar.gz"
